
<!DOCTYPE html>
<html>
<head>
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

	<!-- Google Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">

	<style>
		/* 基本重置 */
		html, body {
			height: 100%;
			margin: 0;
		}
		body {
			display: flex;
			justify-content: center;
			align-items: center;
			background: transparent;
		}

		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}

		/* ========== 导航容器 ========== */
		.navMenu {
			font-family: "Noto Serif SC", serif;
			font-optical-sizing: auto;
			font-weight: 400;
			font-style: normal;
			padding: 8px;
			margin: 0;

			/* 可调参数 */
			--nav-gap: clamp(28px, 6vw, 240px);
			--arc-radius: 24px;
			--arc-thickness: 3px;
			--stroke-color: #e8f1ec;

			/* 布局：保持单行、平均分配、间距自适应 */
			display: flex;
			flex-wrap: nowrap;
			justify-content: space-between;
			align-items: center;
			gap: var(--nav-gap);
			width: 95%;
			max-width: none;

			position: relative;

			/* ========== 四角四分之一圆边框 ========== */
			background-repeat: no-repeat;
			background-position: left top, right top, left bottom, right bottom;
			background-size:
				var(--arc-radius) var(--arc-radius),
				var(--arc-radius) var(--arc-radius),
				var(--arc-radius) var(--arc-radius),
				var(--arc-radius) var(--arc-radius);

			background-image:
				/* 左上角 */
				radial-gradient(circle at right bottom,
					transparent calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) var(--arc-radius),
					transparent var(--arc-radius)
				),
				/* 右上角 */
				radial-gradient(circle at left bottom,
					transparent calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) var(--arc-radius),
					transparent var(--arc-radius)
				),
				/* 左下角 */
				radial-gradient(circle at right top,
					transparent calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) var(--arc-radius),
					transparent var(--arc-radius)
				),
				/* 右下角 */
				radial-gradient(circle at left top,
					transparent calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) calc(var(--arc-radius) - var(--arc-thickness)),
					var(--stroke-color) var(--arc-radius),
					transparent var(--arc-radius)
				);
		}

		/* ========== 上下点-短横边框 ========== */
		.navMenu::before,
		.navMenu::after {
			content: "";
			position: absolute;
			left: var(--arc-radius);
			right: var(--arc-radius);
			height: var(--arc-thickness);
			pointer-events: none;
			z-index: 0;

			background-image: repeating-linear-gradient(to right,
				var(--stroke-color) 0px 3px,
				transparent 3px 7px,
				var(--stroke-color) 7px 20px,
				transparent 20px 26px
			);
			background-repeat: repeat-x;
		}

		.navMenu::before { top: 0; }
		.navMenu::after { bottom: 0; }

		/* 确保内容显示在边框之上 */
		.navMenu > * {
			position: relative;
			z-index: 2;
		}

		/* ========== 导航文字与图标 ========== */
		.navMenu a {
			color: #4f936d;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 6px;
			margin: 0;
			font-size: 18px;

			/* 每项平均分配宽度 */
			flex: 1 1 0;
			min-width: 0;
			text-align: center;
			white-space: nowrap;
		}

		/* 鼠标悬停颜色 */
		.navMenu a:hover {
			color: var(--stroke-color);
		}

		/* 其他保留的类 */
		.background {
			background-color: #ece5f0;
		}

		.border {
			border: 0px solid #cccccc;
		}
	</style>
</head>

<body>

	<!-- ========== 导航菜单 ========== -->

	<nav class="navMenu border">

		<a id="home" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-solid fa-house"></i> 返回主页
		</a>

		<a id="target" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-sharp-duotone fa-solid fa-bullseye"></i> 任务日志
		</a>

		<a id="movement" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-duotone fa-solid fa-list-check"></i> 行动管理
		</a>

		<a id="backpack" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-duotone fa-solid fa-bag-shopping"></i> 我的背包
		</a>

		<a id="friend" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-duotone fa-solid fa-people-robbery"></i> 人际关系
		</a>

		<a id="record" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-duotone fa-solid fa-atom"></i> 人生记录
		</a>

		<a id="work" onclick="navigate(this.id); return false;" href="#">
			<i class="fa-duotone fa-solid fa-comments"></i> 创意工坊
		</a>

	</nav>

	<script>

		/* ========== 原有方向设置，保持不变 ========== */

		let direction = "horizontal";

		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>
			.navMenu a {display: block; text-align:left; margin:7px}
			i {width:15px; margin-right:5px}
			.navMenu {margin:3px}
			</style>`);
		}


		/* ========== MODIFIED：自动识别运行环境 ========== */

		// 检测是否运行在 Electron 桌面应用中
		const isNotionDesktop = /Electron/i.test(navigator.userAgent);


		/* ========== 导航页面地址 ========== */

		const pageUrls = {
			home: "https://app.notion.com/p/Diane-s-2026-32dce5f78ddc8310a07d01f6e461cc48",

			target: "https://app.notion.com/p/7a8ce5f78ddc8391b8ec812ef84426ff",

			movement: "https://app.notion.com/p/c49ce5f78ddc8289a003817e6b8a9591",

			backpack: "https://app.notion.com/p/f23ce5f78ddc82a2bdb98114bcdeee5d",

			friend: "https://app.notion.com/p/25dce5f78ddc8383911901b1d05073dc",

			record: "https://app.notion.com/p/19cce5f78ddc825b972781731bae2690",

			work: "https://app.notion.com/p/b5bce5f78ddc836a99a081b7a0e2b65a"
		};


		/* ========== MODIFIED：双模式导航函数 ========== */

		function navigate(id) {

			const url = pageUrls[id];

			// 防止无效链接
			if (!url) return;

			if (isNotionDesktop) {

				// Notion 桌面端：使用 Notion 深层链接
				const notionUrl = url.replace(
					/^https:\/\//i,
					"notion://"
				);

				window.location.href = notionUrl;

			} else {

				// Notion 网页版：使用 HTTPS，在当前页面跳转
				window.top.location.href = url;

			}
		}

	</script>

</body>
</html>
